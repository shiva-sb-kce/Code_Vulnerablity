<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodeGuard AI — Vulnerability Agent</title>
  <meta name="description" content="AI-powered code vulnerability scanner that identifies security issues and applies fixes automatically." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#a78bfa"/>
              <stop offset="100%" style="stop-color:#38bdf8"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-text">CodeGuard <span class="logo-ai">AI</span></span>
    </div>
    <div class="header-center">
      <div class="api-key-container">
        <svg class="key-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <input type="password" id="apiKeyInput" class="api-key-input" placeholder="Gemini API Key..." oninput="saveApiKey()" />
      </div>
    </div>
    <div class="header-badge">
      <span class="pulse-dot"></span>
      Gemini 2.0 Flash
    </div>
  </div>
</header>

<!-- MAIN LAYOUT -->
<main class="main-layout">

  <!-- LEFT PANEL: Code Input -->
  <section class="panel left-panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Code Editor
      </div>
      <div class="panel-controls">
        <select id="modelSelect" class="lang-select" title="Gemini AI Model">
          <option value="gemini-1.5-flash">Gemini 1.5 Flash (Stable)</option>
          <option value="gemini-2.0-flash" selected>Gemini 2.0 Flash (Fast)</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro (Precise)</option>
        </select>
        <select id="languageSelect" class="lang-select">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
          <option value="php">PHP</option>
          <option value="sql">SQL</option>
          <option value="go">Go</option>
          <option value="cpp">C++</option>
          <option value="typescript">TypeScript</option>
        </select>
        <button id="clearBtn" class="btn-icon" title="Clear code" onclick="clearCode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </div>

    <div class="editor-wrapper">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea
        id="codeInput"
        class="code-editor"
        placeholder="// Paste your code here...&#10;// Example vulnerable Python code:&#10;&#10;def login(username, password):&#10;    query = f&quot;SELECT * FROM users WHERE user='{username}'&quot;&#10;    ..."
        spellcheck="false"
      ></textarea>
    </div>

    <div class="panel-footer">
      <span id="lineCount" class="line-info">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        0 lines
      </span>
      <button id="analyzeBtn" class="btn-scan" onclick="analyzeCode()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Scan for Vulnerabilities
      </button>
    </div>
  </section>

  <!-- DIVIDER -->
  <div class="panel-divider"></div>

  <!-- RIGHT PANEL: Results -->
  <section class="panel right-panel" id="rightPanel">
    <div class="panel-header">
      <div class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Security Analysis
      </div>
      <div id="overallRisk" class="risk-badge hidden"></div>
    </div>

    <!-- Empty State -->
    <div class="center-state" id="emptyState">
      <div class="empty-graphic">
        <div class="shield-bg">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
      </div>
      <h3 class="state-title">Ready to Scan</h3>
      <p class="state-sub">Paste your code on the left, then hit<br/><strong>Scan for Vulnerabilities</strong></p>
      <div class="state-tips">
        <div class="tip-chip">Python</div>
        <div class="tip-chip">JavaScript</div>
        <div class="tip-chip">Java</div>
        <div class="tip-chip">PHP</div>
        <div class="tip-chip">SQL</div>
      </div>
    </div>

    <!-- Loading State -->
    <div class="center-state hidden" id="loadingState">
      <div class="radar-wrapper">
        <div class="radar-ring r1"></div>
        <div class="radar-ring r2"></div>
        <div class="radar-ring r3"></div>
        <div class="radar-dot"></div>
        <div class="radar-sweep"></div>
      </div>
      <h3 class="state-title">Scanning Code<span class="blink-dots"><span>.</span><span>.</span><span>.</span></span></h3>
      <p class="state-sub">Gemini is analyzing for vulnerabilities</p>
    </div>

    <!-- Results Area -->
    <div id="resultsArea" class="results-area hidden">
      <!-- Summary -->
      <div class="summary-card" id="summaryCard">
        <div class="summary-left">
          <div class="summary-icon">⚡</div>
          <p id="summaryText" class="summary-text"></p>
        </div>
      </div>

      <!-- Vulnerability Cards -->
      <div class="vuln-list" id="vulnList"></div>

      <!-- Apply Section -->
      <div class="apply-section hidden" id="applySection">
        <div class="apply-info" id="acceptedInfo"></div>
        <button class="btn-apply" id="applyAllBtn" onclick="applyAllAccepted()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          Apply Accepted Fixes
        </button>
      </div>
    </div>

  </section>
</main>

<!-- FIXED CODE MODAL -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">
        <div class="modal-title-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        Fixed Code Ready
      </div>
      <button class="modal-close" onclick="closeModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-code-wrapper">
        <div class="modal-code-topbar">
          <span class="modal-code-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            fixed_code
          </span>
          <button class="copy-btn" id="copyBtn" onclick="copyFixed()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy Code
          </button>
        </div>
        <pre id="fixedCodeDisplay" class="fixed-code"></pre>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost-modal" onclick="closeModal()">Cancel</button>
      <button class="btn-use-code" onclick="useFixedCode()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Use in Editor
      </button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
